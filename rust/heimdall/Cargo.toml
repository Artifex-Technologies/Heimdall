[package]
name = "heimdall"
version = "0.1.0"
description = "Heimdall's always-on daemon, ported from Go (shadow mode until the switch)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "heimdall"
path = "src/lib.rs"

[[bin]]
name = "heimdalld-rs"
path = "src/main.rs"

# Exact versions on purpose (the lock file pins the rest); cargo-audit runs over Cargo.lock in CI.
[dependencies]
# Unicode case folding is needed ((?i) folds the long s and the Kelvin sign as Go does); \w \d \s \b are written out as
# Go's ASCII classes by rules.rs, so the Unicode Perl classes are left out.
regex = { version = "=1.12.3", default-features = false, features = ["std", "perf", "unicode-case"] }
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }
rustix = { version = "=1.1.4", default-features = false, features = ["std", "fs", "process", "event", "thread"] }
# signalfd and sigprocmask: the daemon's one loop wakes on SIGTERM like on any other descriptor
libc = { version = "=0.2.186", default-features = false }
# the IP databases are mapped read-only, not read into the heap (phase 0's design)
memmap2 = { version = "=0.9.11", default-features = false }
# pacman's mtree files are gzip (pkgverify); pure Rust backend
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"] }
# the mesh (mesh.rs): TLS 1.3 only (pinned in its own configs), ring for the crypto and the ed25519 keys Go wrote; no CA, the
# peers' keys are checked against the owner's list by our own verifiers. tls12: the Wi-Fi checks talk to the internet as Go's
# client and OpenSSL do (a middlebox that only speaks TLS 1.2 must still show its certificate, src/cli/wifihealth/http.rs)
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
ring = { version = "=0.17.14", default-features = false }

[dev-dependencies]
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
# the tests also compile the Go patterns with Rust's own Unicode \b \s \d \w, to show what the translation prevents
regex = { version = "=1.12.3", features = ["unicode"] }
serde_json = "=1.0.149"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
