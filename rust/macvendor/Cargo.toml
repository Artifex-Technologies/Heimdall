[package]
name = "heimdall-macvendor"
version = "0.1.0"
description = "Who made a hardware (MAC) address, from the IEEE registries on disk (MA-L, MA-M, MA-S, IAB); private, multicast and special addresses"
# Written out instead of inherited from the workspace, so Yggdrasil and LykanOS's tools can use the crate as a git dependency
edition = "2021"
license = "MPL-2.0"
rust-version = "1.82"
publish = false

[lib]
name = "heimdall_macvendor"
path = "src/lib.rs"

# No dependencies: the standard library reads the files and keeps the table.
[dependencies]

[dev-dependencies]
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
# the Go twin's answers (testdata/parity/macvendor.json)
serde_json = "=1.0.149"
