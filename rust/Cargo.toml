[workspace]
resolver = "2"
members = ["heimdall", "scrub", "flyover-attack"]
# cargo-fuzz targets build with a nightly toolchain of their own; they are not part of the normal build
exclude = ["fuzz"]

[workspace.package]
edition = "2021"
license = "MPL-2.0"
rust-version = "1.82"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# unwinding stays on: a detector that panics on hostile input loses that one event, not the daemon (engine.rs)
panic = "unwind"

# The scrub's DSP and the flyover scorer do millions of operations per second of audio: their tests take seconds only when
# optimised, so they are built that way in test builds too (the daemon's crate keeps the default).
[profile.dev.package.heimdall-scrub]
opt-level = 3

[profile.dev.package.flyover-attack]
opt-level = 3
