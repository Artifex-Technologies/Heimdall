# The Rust port of heimdalld (rust/): build, tests (the Go fixtures included), lints, and a dependency audit.
name: rust
on:
  push:
    paths: ["rust/**", "internal/**", "testdata/**", "cmd/**", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["rust/**", "internal/**", "testdata/**", "cmd/**", ".github/workflows/rust.yml"]
  schedule:
    - cron: "17 5 * * 1" # the audit weekly, for advisories published after the last change
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: the Go fixtures are current
        working-directory: .
        run: go test ./internal/parity ./cmd/heimdalld ./internal/detect -run 'Fixtures|ParityDetectors|RustRuleFile'
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: the engine differential (Go and Rust on the same synthetic events)
        working-directory: .
        run: rust/parity/engine-differential.sh 50000
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo install --locked cargo-audit
      - run: cargo audit --file rust/Cargo.lock --deny warnings
