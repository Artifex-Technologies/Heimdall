# The Rust port of heimdalld (rust/): build, tests (the Go fixtures included), lints, and a dependency audit.
name: rust
on:
  push:
    # packaging/: the Wi-Fi helpers' Python programs, which tests/cli_wifitools.rs runs beside their Rust ports
    paths: ["rust/**", "internal/**", "testdata/**", "cmd/**", "packaging/**", "VERSION", "*.go", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["rust/**", "internal/**", "testdata/**", "cmd/**", "packaging/**", "VERSION", "*.go", ".github/workflows/rust.yml"]
  schedule:
    - cron: "17 5 * * 1" # the audit weekly, for advisories published after the last change
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: every Go file is gofmt-formatted
        working-directory: .
        run: |
          unformatted=$(gofmt -l .)
          [ -z "$unformatted" ] || { echo "run gofmt -w on:"; echo "$unformatted"; exit 1; }
      - name: the Go fixtures are current
        working-directory: .
        run: go test ./internal/parity ./cmd/heimdalld ./internal/detect ./internal/macvendor ./internal/immunity -run 'Fixtures|ParityDetectors|RustRuleFile' && go test ./internal/attack
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # the command tests run Go and Rust in fake roots (user + mount namespaces); Ubuntu's AppArmor blocks those for
      # normal users by default, which made every fake-root test fail here since 6b1c858
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # tests/cli_shtools.rs (the shell scripts beside their ports) needs Arch's tools: the job shtools-arch runs it
      - run: cargo test --locked
        env:
          HEIMDALL_SHTOOLS_RUN_IN_ARCH: "1"
      - name: the rogue-router watch on the kernel's IPv6 table, in a throwaway network namespace
        working-directory: .
        run: go test ./internal/sources/netsource && packaging/tests/netns-rogue.sh
      - name: the Python programs' own tests (packaging/tests)
        working-directory: .
        run: python3 -m unittest discover -s packaging/tests -p 'test_*.py'
      - name: the engine differential (Go and Rust on the same synthetic events)
        working-directory: .
        run: rust/parity/engine-differential.sh 50000
  # tests/cli_shtools.rs: the shell programs (which only ever run on Arch) beside their Rust ports, the scripts with Arch's
  # own curl, coreutils, gawk, grep and sed, as on a real install (Ubuntu's differ: uutils coreutils' messages, awk only
  # through /etc/alternatives). Privileged: the fake roots are user, mount, pid and network namespaces.
  shtools-arch:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Arch's tools, Rust, and subordinate ids for the fake roots' other users
        working-directory: /
        run: |
          pacman -Syu --noconfirm --needed git rust gcc python openssl curl gzip gawk grep sed coreutils findutils util-linux iproute2 shadow
          echo root:100000:65536 >> /etc/subuid
          echo root:100000:65536 >> /etc/subgid
      - uses: actions/checkout@v4
      - run: cargo test --locked -p heimdall --test cli_shtools -- --nocapture
  # heimdall-yara-check (rust/yara-check): YARA-X's compile check of rule drafts, a workspace of its own (yara-x brings
  # wasmtime); then the Go daemon's drafts against the real checker
  yara-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/yara-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --locked --release --all-targets -- -D warnings
      - run: cargo test --locked --release
      - run: cargo build --locked --release && ls -l target/release/heimdall-yara-check
      - name: the Go daemon's rule drafts with the real checker
        working-directory: .
        run: HEIMDALL_TEST_YARA_X="$PWD/rust/yara-check/target/release/heimdall-yara-check" go test ./internal/immunity -run RealYARAX -v
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo install --locked cargo-audit
      - run: cargo audit --file rust/Cargo.lock --deny warnings
      # RUSTSEC-2025-0141: bincode is unmaintained (no vulnerability); yara-x uses it only to save and load compiled rules,
      # which heimdall-yara-check never does (it compiles one rule from stdin and prints a verdict)
      - run: cargo audit --file rust/yara-check/Cargo.lock --deny warnings --ignore RUSTSEC-2025-0141
