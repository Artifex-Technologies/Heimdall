# Heimdall: "Microphone (private)", the real microphone without the sounds that can place or date a call or recording
# (aircraft tones, mains hum). Installed as /usr/share/pipewire/pipewire.conf.d/60-heimdall-private-mic.conf.
#
# The filter runs inside the PipeWire daemon (no extra process; the LADSPA plugin never allocates on the real-time
# thread and goes silent rather than passing the raw microphone if it ever fails). WirePlumber's
# heimdall/private-mic.lua makes it the input every app records (docs/LOCATION_SOUNDS.md).
#
# Mono on purpose: one channel of DSP (about 1.4 % of a desktop core, 2 % with the disguise on); a stereo microphone is
# mixed down first.
context.modules = [
    { name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Microphone (private)"
            media.name       = "Microphone (private)"
            filter.graph = {
                # scrub -> (the voiceprint tap, planned) -> disguise. The scrub always runs; "Disguise my voice" is off
                # by default (Preset 0: the voice passes sample for sample, no delay). WirePlumber's
                # heimdall/private-mic.lua sets Preset from heimdall.private-mic.disguise (docs/VOICE_DISGUISE.md).
                # Sarina's planned speaker check ("my voice only") must hear the voice before the disguise: its tap goes
                # between the two nodes, never after the disguise.
                nodes = [
                    {
                        type   = ladspa
                        name   = scrub
                        # /usr/lib/ladspa/heimdall-scrub.so (or LADSPA_PATH)
                        plugin = "heimdall-scrub"
                        label  = heimdall_scrub
                    }
                    {
                        type    = ladspa
                        name    = disguise
                        plugin  = "heimdall-scrub"
                        label   = heimdall_disguise
                        control = { "Preset" = 0 }
                    }
                ]
                links = [
                    { output = "scrub:Output" input = "disguise:Input" }
                ]
                inputs  = [ "scrub:Input" ]
                outputs = [ "disguise:Output" ]
            }
            audio.channels = 1
            audio.position = [ MONO ]
            capture.props = {
                node.name        = "heimdall.private-mic.capture"
                node.description = "Microphone (private): input"
                # it records only while something records the private microphone
                node.passive     = true
            }
            playback.props = {
                node.name        = "heimdall.private-mic"
                node.description = "Microphone (private)"
                media.class      = "Audio/Source"
                device.icon-name = "audio-input-microphone"
                # low: with enforcement off, the owner's own default microphone wins
                priority.session = 100
            }
        }
    }
]
