# Heimdall: the private microphone in WirePlumber. Installed as
# /usr/share/wireplumber/wireplumber.conf.d/60-heimdall-private-mic.conf; the script as
# /usr/share/wireplumber/scripts/heimdall/private-mic.lua.
#
# On/off: `heimdall-private-mic on|off` (or `wpctl settings --save heimdall.private-mic.enforce false`), at once, no
# restart. docs/LOCATION_SOUNDS.md. The voice disguise: `heimdall-private-mic disguise on|off|lower|higher`.

wireplumber.settings.schema = {
  heimdall.private-mic.enforce = {
    name = "Private microphone"
    description = "Every app records the private microphone (aircraft tones and mains hum removed)"
    type = "bool"
    default = true
  }
  # "Disguise my voice" on the private microphone (docs/VOICE_DISGUISE.md): off by default; `heimdall-private-mic disguise
  # on|off|lower|higher`. The script sets the filter's Preset control from these two.
  heimdall.private-mic.disguise = {
    name = "Disguise my voice"
    description = "The private microphone shifts the voice's pitch and formants (hides casual recognition only)"
    type = "bool"
    default = false
  }
  heimdall.private-mic.disguise-preset = {
    name = "Disguise preset"
    description = "How the voice is disguised: lower or higher"
    type = "string"
    default = "lower"
  }
}

wireplumber.components = [
  {
    name = heimdall/private-mic.lua, type = script/lua
    provides = custom.heimdall-private-mic
    requires = [ support.settings, support.standard-event-source ]
  }
]

wireplumber.profiles = {
  main = {
    custom.heimdall-private-mic = required
  }
}
