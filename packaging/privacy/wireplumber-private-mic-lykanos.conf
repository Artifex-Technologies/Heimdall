# Heimdall's private microphone, the LykanOS-only part. Installed as /usr/share/heimdall-private-mic/lykanos.conf and
# linked into /etc/wireplumber/wireplumber.conf.d/ by `heimdall-private-mic os-setup` (the package's pacman hook) only
# where /etc/os-release says ID=lykanos; on Labyrinth OS it is never linked, so the setting does not exist there.
#
# heimdall.private-mic.sarina-raw (off by default): Sarina's voice input (the stream with
# heimdall.private-mic.exempt = "sarina-voice", which Yggdrasil's panel sets) records the real microphone. Every other app
# stays on the private one. Switch: Settings > Security > Privacy on LykanOS, or `heimdall-private-mic sarina-raw on|off`.

wireplumber.settings.schema = {
  heimdall.private-mic.sarina-raw = {
    name = "Sarina's voice input: the real microphone"
    description = "Only Sarina's voice input records the real microphone; every other app stays on the private one (LykanOS)"
    type = "bool"
    default = false
  }
}

# the marker the script checks before honouring the setting
heimdall.private-mic.os = {
  lykanos = true
}
