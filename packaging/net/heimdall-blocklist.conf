# Heimdall: known malware, phishing, scam and botnet domains (and every name under them) do not resolve.
# Written daily by heimdall-dns-blocklist; to allow a domain: sudo heimdall-dns-blocklist allow DOMAIN
conf-file=/var/lib/heimdall-dns/blocklist.conf
# a slightly larger cache than NetworkManager's default
cache-size=2000
