# Heimdall: DNS rebinding protection. An answer from the internet that points at this computer (127.0.0.0/8) or at a private
# network address is dropped: a web page cannot make its own name point at a service on this computer or at the router to reach
# it from the browser. Local network names (router, printer, NAS) still resolve.
stop-dns-rebind
rebind-domain-ok=/lan/local/home/home.arpa/internal/localdomain/
