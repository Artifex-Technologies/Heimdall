# Heimdall: on Wi-Fi networks you have not trusted, the computer uses a random hardware address of its own for each network (stable on
# that network, so sign-in pages remember you, but different everywhere else, so you cannot be followed from network to network).
# Trusted networks (sudo heimdall-wifi-guard trust) keep the real one. Scans already use random addresses.
[connection-heimdall-wifi-privacy]
match-device=type:wifi
wifi.cloned-mac-address=stable
