# Heimdall: on Wi-Fi networks you have not trusted, the computer uses a random hardware address of its own for each network (stable on
# that network, so sign-in pages remember you, but different everywhere else, so you cannot be followed from network to network).
# A home network made so with --real-address (sudo heimdall-wifi-guard trust --home --real-address) keeps the real one. Scans
# already use random addresses.
# The address is locally administered (the bit phones set); no maker's prefix is kept or borrowed.
# The DHCP client ID and DHCPv6 DUID are made from the address in use, not from this computer's machine-id, and no computer name
# is sent from the first connection on (the guard writes the same into each untrusted profile).
[connection-heimdall-wifi-privacy]
match-device=type:wifi
wifi.cloned-mac-address=stable
ipv4.dhcp-client-id=mac
ipv6.dhcp-duid=ll
ipv4.dhcp-send-hostname=false
ipv6.dhcp-send-hostname=false

# Wired networks the same, from their first connection: a hardware address of its own, DHCP identifiers from it, no name. A home
# network whose router keeps an address for this computer: sudo heimdall-wifi-guard trust --home --real-address (the profile then
# says "permanent" and sends the name, which wins over these defaults).
[connection-heimdall-wired-privacy]
match-device=type:ethernet
ethernet.cloned-mac-address=stable
ipv4.dhcp-client-id=mac
ipv6.dhcp-duid=ll
ipv4.dhcp-send-hostname=false
ipv6.dhcp-send-hostname=false

# IPv6 privacy addresses on Wi-Fi and wired: temporary addresses for the connections this computer makes (RFC 8981), and an
# interface ID that is not made from the hardware address (RFC 7217). A profile that sets its own values keeps them; the guard
# sets these on every untrusted profile too.
[connection-heimdall-ipv6-privacy]
match-device=type:wifi,type:ethernet
ipv6.ip6-privacy=2
ipv6.addr-gen-mode=stable-privacy
